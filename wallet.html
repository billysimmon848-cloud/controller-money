<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wallet | JustDoks</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
  >

  <link
    rel="stylesheet"
    href="index.css"
  >

  <link
    rel="stylesheet"
    href="wallet.css"
  >

</head>

<body>


  <!-- ===========================
       NAVBAR
  =========================== -->

  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">

    <div class="container">

      <a
        class="navbar-brand"
        href="index.html"
      >
        JustDoks
      </a>


      <div class="ml-auto">

        <a
          href="index.html"
          class="nav-link d-inline-block"
        >
          AI Tools
        </a>

        <button
          id="logoutButton"
          class="btn btn-primary ml-3"
        >
          Logout
        </button>

      </div>

    </div>

  </nav>


  <!-- ===========================
       WALLET
  =========================== -->

  <section class="container mt-5 pt-5">

    <div class="ai-box p-4">


      <h2>
        My Wallet
      </h2>


      <!-- =========================
           BALANCE
      ========================= -->

      <div class="mt-4">

        <p>
          Available Balance
        </p>

        <h1 id="walletBalance">
          $0.00
        </h1>

      </div>


      <hr>


      <!-- =========================
           FUND WALLET
      ========================= -->

      <h4>
        Fund Your Wallet
      </h4>


      <p class="text-light">
        Add funds to your wallet using BNB.
      </p>


      <!-- =========================
           BNB FUNDING
      ========================= -->

      <div class="bnb-funding-box mt-4">

        <h5>
          Fund with BNB
        </h5>


        <p>
          Send BNB to your personal deposit address below.
        </p>


        <label>
          Your BNB Deposit Address
        </label>


        <div class="bnb-address-row">

          <input
            type="text"
            id="bnbAddress"
            class="form-control"
            readonly
          >

          <button
            type="button"
            id="copyBnbButton"
            class="btn btn-primary ml-2"
          >
            Copy
          </button>

        </div>


        <p
          id="bnbMessage"
          class="mt-3"
        ></p>


        <small>
          Your payment will be detected automatically after confirmation.
        </small>

      </div>


      <!-- =========================
           SEND MONEY
      ========================= -->

      <hr class="mt-5">


      <h4>
        Send Money
      </h4>


      <p class="text-light">
        Send money to another JustDoks user.
      </p>


      <div class="send-money-box mt-4">


        <!-- RECIPIENT EMAIL -->

        <div class="form-group">

          <label for="recipientEmail">
            Recipient Email
          </label>

          <input
            type="email"
            id="recipientEmail"
            class="form-control"
            placeholder="Enter recipient's email"
          >

        </div>


        <!-- AMOUNT -->

        <div class="form-group">

          <label for="transferAmount">
            Amount
          </label>

          <input
            type="number"
            id="transferAmount"
            class="form-control"
            placeholder="0.00"
            min="1"
            step="0.01"
          >

        </div>


        <!-- SEND BUTTON -->

        <button
          type="button"
          id="sendMoneyButton"
          class="btn btn-primary"
        >
          Send Money
        </button>


        <!-- MESSAGE -->

        <p
          id="transferMessage"
          class="mt-3"
        ></p>


      </div>


      <!-- =========================
           GENERAL WALLET MESSAGE
      ========================= -->

      <p
        id="walletMessage"
        class="mt-3"
      ></p>


    </div>

  </section>


  <script src="wallet.js"></script>

</body>

</html>
